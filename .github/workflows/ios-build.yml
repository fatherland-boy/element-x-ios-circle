name: iOS Build Check

on:
  push:
    branches: [ main, feature/video-notes ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Dependencies
        run: |
          # Element X usually uses Swift Package Manager (SPM),
          # so we just need to ensure the project can resolve them.
          # No separate install step usually needed for pure SPM projects.
          echo "Resolving dependencies..."

      - name: Build Project
        run: |
          xcodebuild -scheme ElementX \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     build
